<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Processing Studio</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">

        <div class="hero-card">

            <h1>
                AI Processing Studio
            </h1>

            <p>
                Queue and process documents asynchronously
            </p>


            <div class="upload-box">

                <input
                    id="fileInput"
                    type="file"
                    accept=".pdf"
                >

                <button onclick="createJob()">
                    Upload & Process
                </button>

            </div>


            <button
                class="status-btn"
                onclick="openModal()"
            >

                View Status

            </button>

        </div>

    </div>


    <!-- MODAL -->

    <div
        id="statusModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Processing Status
                </h2>

                <button
                    class="close-btn"
                    onclick="closeModal()"
                >

                    ✕

                </button>

            </div>


            <div
                id="jobsContainer"
                class="jobs-grid"
            >

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
